name: Atelier
options:
  bundleIdPrefix: ua.atelier
  deploymentTarget:
    iOS: '17.0'
targets:
  Atelier:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.atelier.notebook
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ательє
        INFOPLIST_KEY_NSFaceIDUsageDescription: Захист замовлень і даних клієнтів
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - sdk: libsqlite3.tbd
  AtelierTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atelier
  AtelierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
    dependencies:
      - target: Atelier
schemes:
  Atelier:
    build:
      targets:
        Atelier: all
        AtelierTests: [test]
        AtelierUITests: [test]
    test:
      targets: [AtelierTests, AtelierUITests]
